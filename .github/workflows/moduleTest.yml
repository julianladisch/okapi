name: ModuleTest
on:
  workflow_dispatch:
  push:
    branches:
      - 'pinOkapiVersion'
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode package -Dtest=ModuleTest -Dsurefire.failIfNoSpecifiedTests=false
